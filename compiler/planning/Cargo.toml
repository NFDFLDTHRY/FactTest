[package]
name = "factc-planning"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "FactTest planner: finite CandidateStrategy over H_G with source-visible objective dispatch and honest result strength (PLANNER-COST-MODEL.md). Never emits verified state; never depends on the verifier."

[lib]
path = "src/lib.rs"

[dependencies]
factc-foundation = { path = "../foundation" }
factc-source = { path = "../source" }
factc-semantic = { path = "../semantic" }
factc-capability = { path = "../capability" }
factc-implementation = { path = "../implementation" }
