<body>
<h1>__TITLE__</h1>
<p>Generated capability-parametric WebApp (FactTest object B). Bundle <code>__BUNDLE_ID__</code>. Strategy <code>__STRATEGY_ID__</code>.</p>
<div><button id="init">init (E0)</button><button id="relay">relay payload</button><button id="destroy">destroy WEBGPU (controlled loss)</button></div>
<pre id="out">idle</pre>
<script type="module">
import { init, relay, destroyBackend, snapshot } from './runtime.js';
const out = document.getElementById('out');
const show = () => { out.textContent = JSON.stringify(snapshot(), (k, v) => (v instanceof Uint8Array ? [...v] : v), 2); };
document.getElementById('init').onclick = async () => { await init(); show(); };
document.getElementById('relay').onclick = async () => { await relay(new Uint8Array([0x00,0x01,0x7f,0x80,0xff,0x55,0xaa,0x10])); show(); };
document.getElementById('destroy').onclick = async () => { await destroyBackend('WEBGPU'); show(); };
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(() => {}); }
</script>
