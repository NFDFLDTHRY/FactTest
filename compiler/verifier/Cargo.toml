[package]
name = "factc-verifier"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "FactTest independent verifier: finite deterministic rule classes over TypedSystemIR, obligations, contracts and a CandidateStrategy; sole owner of VerifiedStrategy (VERIFICATION-CERTIFICATES.md). Consumes planner output as data, never planner heuristics."

[lib]
path = "src/lib.rs"

[dependencies]
factc-foundation = { path = "../foundation" }
factc-source = { path = "../source" }
factc-semantic = { path = "../semantic" }
factc-capability = { path = "../capability" }
factc-implementation = { path = "../implementation" }
factc-planning = { path = "../planning" }
