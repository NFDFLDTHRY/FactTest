[package]
name = "factc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "FactTest host driver: files in, kernel artifacts out. Owns no semantics (BOOTSTRAP-ARCHITECTURE.md section 2)."

[[bin]]
name = "factc"
path = "src/main.rs"

[dependencies]
factc-kernel = { path = "../../compiler/kernel" }
factc-foundation = { path = "../../compiler/foundation" }
